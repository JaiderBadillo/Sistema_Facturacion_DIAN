# Blueprint de Render para Folio (simulador de facturación electrónica).
# Pasos completos en DESPLIEGUE_RENDER.md.
services:
  - type: web
    name: sistema-facturacion-dian
    runtime: docker
    plan: free
    healthCheckPath: /folio.css      # ruta pública; las demás piden usuario y contraseña
    envVars:
      # Acceso: el sitio está abierto (sin ingreso). Para pedir usuario y contraseña, ponga
      # FOLIO_ACCESO_ABIERTO=false y cree FOLIO_USUARIO y FOLIO_CLAVE; sin ninguno de los dos, el sitio responde 503.
      - key: FOLIO_ACCESO_ABIERTO
        value: "true"
      # Tope de correos por día (protege la cuenta de Brevo mientras el sitio esté abierto).
      - key: FOLIO_MAX_CORREOS_DIA
        value: "30"
      # Correo por Brevo (API HTTPS; Render bloquea SMTP en el plan gratuito).
      - key: FOLIO_BREVO_KEY
        sync: false
      - key: FOLIO_BREVO_REMITENTE   # remitente verificado en Brevo
        sync: false
      # Secreto para los reintentos y callbacks; Render lo genera.
      - key: FOLIO_TOKEN
        generateValue: true
      # Datos. En el plan gratuito son temporales: se pierden al reiniciar o redesplegar.
      - key: FOLIO_DATA_DIR
        value: /app/data/facturas
    # Para conservar los datos hace falta un plan de pago con disco:
    # 1) cambie plan: free por plan: starter, 2) descomente el disco y 3) ponga FOLIO_DATA_DIR=/var/data/facturas
    # disk:
    #   name: folio-datos
    #   mountPath: /var/data
    #   sizeGB: 1
